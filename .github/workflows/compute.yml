name: Compute checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  software-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update -qq && sudo apt-get install -y glslc libvulkan-dev mesa-vulkan-drivers
      - run: ./pixel-lab --help
      - name: Display settings and guest deadlines
        run: python3 tests/test_session.py
      - name: Integer dispatch on Mesa software Vulkan
        working-directory: guest
        run: python3 experiment.py doctor --allow-software
      - name: Diffusion and CPU reference on Mesa software Vulkan
        working-directory: guest
        run: python3 experiment.py diffusion --steps 17 --allow-software
      - name: Check touch timing and a replay on Mesa software Vulkan
        run: |
          python3 tests/touch_schedule.py
          git archive HEAD guest | tar -xC "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/guest"
          python3 experiment.py diffusion --trace "$GITHUB_WORKSPACE/examples/touch/spiral.json" --steps 24 --allow-software
      - name: Inference receipts reject incomplete or substituted benchmark rows
        run: |
          python3 tests/test_inference.py
          python3 tests/test_schedule.py
          python3 tests/test_model_check.py
          sh -n guest/build-inference-runtime.sh
